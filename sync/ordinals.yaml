# Field-number ledger. Append-only; generated by `just sync`.
#
# Rule 9: field numbers come from here, never from position. The ontology
# adds fields to existing types alphabetically, so a generator numbering by
# position would renumber half of a large message on a routine spec bump --
# a wire break that `buf breaking` cannot see, because both sides of the
# comparison were regenerated the same way.
#
# Never edit a number by hand. A retired number is never reissued: a
# consumer may still hold a message that used it.
