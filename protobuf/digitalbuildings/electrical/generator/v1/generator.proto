    }
  ];

  // Numbers whose field the ontology no longer declares. Never reissued: a
  // consumer may still hold a message that used one.
  reserved 32, 33, 34, 35, 36, 37, 38, 39, 40, 48, 49, 50, 51, 52, 53, 54, 55, 56;
}
